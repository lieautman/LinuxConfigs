conky.config = {
    background = true,
    update_interval = 1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,

    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = false,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    gap_x = 20,
    gap_y = 40,

    minimum_width = 500,
    maximum_width = 500,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 0.9,
    override_utf8_locale = true,

    default_color = 'lightblue',
    color1 = '#6bdbc1',
    color2 = '#853e7b',
};

conky.text = [[
${color2}${time %A, %d %B %Y} ${alignr}${time %H:%M:%S}${color}

${color1}Hostname:${alignr}${nodename}
${color1}Uptime:${alignr}${uptime}
${color1}Kernel:${alignr}${kernel}

${color1}CPU Usage:${alignr}${cpu}%
${cpugraph 20,500 555555 00aaff}
${voffset 4}
${color1}Core 1:${alignr}${cpu cpu1}%
${color1}Core 2:${alignr}${cpu cpu2}%
${color1}Core 3:${alignr}${cpu cpu3}%
${color1}Core 4:${alignr}${cpu cpu4}%
${color1}Core 5:${alignr}${cpu cpu5}%
${color1}Core 6:${alignr}${cpu cpu6}%
${color1}Core 7:${alignr}${cpu cpu7}%
${color1}Core 8:${alignr}${cpu cpu8}%

${color1}RAM Usage:${alignr}$mem / $memmax ($memperc%)
${membar 5,500}

${color1}Swap Usage:${alignr}$swap / $swapmax ($swapperc%)
${swapbar 5,500}

${color1}Disk Usage:${alignr}${fs_used /} / ${fs_size /}
${fs_bar 5,500 /}

${color1}Network (${addr wlp0s20f3 -4}):
${color1}Down:${alignr}${downspeed wlp0s20f3}/s
${color1}Up:${alignr}${upspeed wlp0s20f3}/s
${downspeedgraph wlp0s20f3 20,250 000000 00aaff} ${alignr}${upspeedgraph wlp0s20f3 20,250 000000 00aaff}

${hr 2}

${color1}Mail summary:${alignr}${time %H:%M:%S}
${execpi 300 bash -c 'source /home/chris/.config/conky/mailDisplayLogic/mail.env && /home/chris/.config/conky/mailDisplayLogic/check_mail.py'}
]];

