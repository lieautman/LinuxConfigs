conky.config = {
    background = true,
    update_interval = 1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,

    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = false,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    gap_x = 10,
    gap_y = 10,

    minimum_width = 250,
    maximum_width = 250,

    minimum_height = 70,
    maximum_height = 70,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 0.9,
    override_utf8_locale = true,

    default_color = 'lightblue',
    color1 = '#6bdbc1',
    color2 = '#853e7b',
};

conky.text = [[
${color2}${time %A, %d %B %Y} ${alignr}${time %H:%M:%S}${color}
${color1}Hostname:${alignr}${nodename}
${color1}Uptime:${alignr}${uptime}
${color1}Kernel:${alignr}${kernel}
]];

